[project]
name = "doc-qa-agent"
version = "0.1.0"
description = "Documentation Q&A agent with Claude citations, pgvector hybrid search, and an MCP server."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Tajaddin Gafarov" }]
dependencies = [
    "anthropic>=0.40.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.4",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "voyageai>=0.3.0",
    "openai>=1.50.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "markdownify>=0.14",
    "lxml>=5.3",
    "tenacity>=9.0",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "mcp[cli]>=1.27,<2",
    "pyyaml>=6.0",
    "tiktoken>=0.8",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
doc-qa-init-db = "scripts.init_db:main"
doc-qa-test-db = "scripts.test_db:main"
doc-qa-ingest = "doc_qa.ingest:main"
doc-qa-api = "doc_qa.api:main"
doc-qa-mcp = "doc_qa.mcp_server:main"
doc-qa-eval = "eval.run_eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_qa"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
