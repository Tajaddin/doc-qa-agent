services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: doc-qa-pg
    environment:
      POSTGRES_USER: docqa
      POSTGRES_PASSWORD: docqa
      POSTGRES_DB: docqa
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docqa -d docqa"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
